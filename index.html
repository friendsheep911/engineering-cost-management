<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青海工程造价管理信息 · 信息价查询</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">青</div>
    <div class="brand-txt">
      <h1>青海工程造价管理信息</h1>
      <p>建设工程材料 / 砂浆 / 劳务 / 机械台班 价格查询</p>
    </div>
  </div>

  <div class="topbar-right">
    <div class="viewtabs" id="viewTabs">
      <button data-view="issue" class="on">当期查询</button>
      <button data-view="trend">历史趋势</button>
      <button data-view="database">数据库检索</button>
      <button data-view="projects">项目调差</button>
    </div>
    <label class="field" id="issueField">
      <span>期数</span>
      <select id="issueSelect"></select>
    </label>
    <button id="btnExport" class="btn">导出 CSV</button>
    <button id="btnExcel" class="btn">导出 Excel</button>
    <button id="btnPrint" class="btn ghost">打印</button>
  </div>
</header>

<section class="controlbar" id="controlbar">
  <div class="row">
    <span class="row-label">地区</span>
    <div id="regionChips" class="chips"></div>
  </div>
  <div class="row">
    <span class="row-label">类型</span>
    <div id="kindChips" class="chips"></div>
  </div>
  <div class="row tools">
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M10 4a6 6 0 1 0 3.7 10.7l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="searchInput" type="search" placeholder="搜索材料名称 / 型号规格 / 备注…">
    </div>
    <div class="seg" id="modeSeg" role="group" aria-label="含税口径">
      <button data-mode="incl" class="on">含税价</button>
      <button data-mode="excl">除税价</button>
      <button data-mode="both">两者</button>
    </div>
    <label class="chk"><input type="checkbox" id="collapseGroups"><span>折叠分组</span></label>
    <label class="chk"><input type="checkbox" id="favoriteOnly"><span>只看收藏（<b id="favoriteCount">0</b>）</span></label>
    <div class="spacer"></div>
    <div class="stat" id="stat"></div>
  </div>
</section>

<section class="controlbar" id="projectBar" hidden>
  <div class="row tools project-tools">
    <button id="btnNewProject" class="btn">新建项目</button>
    <a class="btn ghost link-btn" href="/api/projects/template.xlsx">下载导入模板</a>
    <button id="btnRefreshProjects" class="btn ghost">刷新</button>
    <div class="stat" id="projectStat"></div>
  </div>
</section>

<section class="controlbar" id="dbBar" hidden>
  <div class="row tools">
    <div class="search db-search">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M10 4a6 6 0 1 0 3.7 10.7l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="dbInput" type="search" placeholder="跨全部期次搜索名称 / 规格 / 备注…" autocomplete="off">
    </div>
    <button id="btnDbSearch" class="btn">查询数据库</button>
    <div class="stat" id="dbStat"></div>
  </div>
</section>

<section class="controlbar" id="trendBar" hidden>
  <div class="row tools">
    <div class="search trend-search">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M10 4a6 6 0 1 0 3.7 10.7l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="trendInput" type="search" placeholder="输入材料名 / 规格搜索，如：钢筋、C30、挖土机…" autocomplete="off">
      <div id="trendSug" class="sug" hidden></div>
    </div>
    <div class="stat" id="trendStat"></div>
  </div>
</section>

<main id="content" class="content">
  <div class="placeholder">正在加载数据…</div>
</main>

<main id="trendView" class="content" hidden>
  <div class="placeholder">在上方搜索材料名称，查看其 2020 年以来的价格走势。<br>例如：螺纹钢、C30 混凝土、塔式起重机…</div>
</main>

<main id="dbView" class="content" hidden>
  <div class="placeholder">数据库检索用于 NAS / Docker 版本，可跨全部期次进行全文检索。</div>
</main>

<main id="projectView" class="content project-view" hidden>
  <aside class="project-list-panel">
    <div class="panel-title"><h2>项目</h2><span id="projectCount">0</span></div>
    <div id="projectList" class="project-list"><div class="placeholder small">正在读取项目…</div></div>
  </aside>
  <section id="projectWorkspace" class="project-workspace">
    <div class="empty-project">
      <h2>项目材料调差</h2>
      <p>新建项目后导入 Excel 材料清单，系统会自动匹配基期与当前期信息价并计算调差。</p>
      <button class="btn" data-new-project>新建第一个项目</button>
    </div>
  </section>
</main>

<dialog id="projectDialog" class="project-dialog">
  <form method="dialog" id="projectForm">
    <div class="dialog-head"><h2>新建调差项目</h2><button value="cancel" class="dialog-close" aria-label="关闭">×</button></div>
    <div class="form-grid">
      <label class="full"><span>项目名称</span><input id="projectName" required placeholder="例如：某水库除险加固工程"></label>
      <label><span>地区</span><select id="projectRegion"></select></label>
      <label><span>计价区域</span><select id="projectArea"></select></label>
      <label><span>基期</span><select id="projectBaseIssue" required></select></label>
      <label><span>当前期</span><select id="projectCurrentIssue" required></select></label>
      <label><span>价格口径</span><select id="projectTaxMode"><option value="incl">含税价</option><option value="excl">除税价</option></select></label>
      <label><span>风险阈值</span><div class="input-suffix"><input id="projectThreshold" type="number" min="0" step="0.1" value="5"><b>%</b></div></label>
    </div>
    <div class="dialog-actions"><button value="cancel" class="btn ghost">取消</button><button id="btnCreateProject" value="default" class="btn">创建项目</button></div>
  </form>
</dialog>

<footer class="foot">
  <span id="footMeta"></span>
  <span class="foot-hint">数据由 PDF 自动抽取，仅供查询参考；正式计价请以原刊及其勘误为准。</span>
</footer>

<script src="assets/chart.umd.min.js"></script>
<script src="data/index.js"></script>
<script src="assets/app.js"></script>
<script src="assets/trend.js"></script>
<script src="assets/database.js"></script>
<script src="assets/projects.js"></script>
</body>
</html>
